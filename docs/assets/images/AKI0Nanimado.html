<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AKI0N animado</title>
<style>
:root{--bg:#05060f;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
canvas{width:100%;height:100%;display:block}
</style></head><body><canvas id="c"></canvas>
<script>
const IW=1672,IH=941;
const img.src = 'AKI0N_mejorada_2x.png';
const c=document.getElementById('c'),x=c.getContext('2d');
let mx=0,my=0,tx=0,ty=0;
addEventListener('pointermove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit(){const d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d}
addEventListener('resize',fit);fit();
const stars=[[137,283],[182,354],[184,207],[875,349],[1437,555],[1066,883],[1295,66],[1035,28],[1430,210],[1260,390],[320,415],[60,560],[1600,300],[700,300],[560,60],[1560,800],[100,900],[430,120]].map(s=>({x:s[0],y:s[1],p:Math.random()*6,r:5+Math.random()*7}));
const dust=Array.from({length:70},()=>({x:Math.random()*IW,y:Math.random()*IH,s:.15+Math.random()*.5,r:.6+Math.random()*1.6,p:Math.random()*6}));
const aster=[[355,445,48],[1218,385,26],[1597,552,36],[110,800,58],[1130,886,20],[1285,806,14]];
const L=document.createElement('canvas');L.width=IW;L.height=IH;
const T=document.createElement('canvas');T.width=IW;T.height=IH;
function draw(t){
 t/=1000; if(reduce)t=0;
 mx+=(tx-mx)*.05;my+=(ty-my)*.05;
 const cw=c.width,ch=c.height;
 const sc=Math.max(cw/IW,ch/IH)*(1.06+.02*Math.sin(t*.2));
 x.setTransform(1,0,0,1,0,0);x.fillStyle='#05060f';x.fillRect(0,0,cw,ch);
 x.translate(cw/2-mx*cw*.02,ch/2-my*ch*.02);x.scale(sc,sc);x.translate(-IW/2,-IH/2);
 x.drawImage(img,0,0);
 aster.forEach((a,i)=>{
  const dx=Math.sin(t*.5+i)*7,dy=Math.cos(t*.4+i*2)*9;
  x.save();x.beginPath();x.arc(a[0]+dx,a[1]+dy,a[2],0,7);x.clip();
  x.translate(dx,dy);x.drawImage(img,0,0);x.restore();
 });
 const by=Math.sin(t*.9)*7;
 if(!L.done){const l=L.getContext('2d');
  l.drawImage(img,0,0);l.globalCompositeOperation='destination-in';
  l.save();l.translate(840,640);l.scale(1.15,.82);l.translate(-840,-640);
  const g=l.createRadialGradient(840,640,150,840,640,560);
  g.addColorStop(0,'#000');g.addColorStop(.72,'#000');g.addColorStop(1,'rgba(0,0,0,0)');
  l.fillStyle=g;l.fillRect(-600,-600,IW+1200,IH+1200);l.restore();L.done=1;}
 x.save();x.translate(0,by);x.drawImage(L,0,0);x.restore();
 x.save();x.beginPath();x.rect(868,640+by,78,300);x.clip();
 for(let i=0;i<9;i++){const yy=((t*160+i*45)%300)+640+by;
  const gr=x.createLinearGradient(0,yy-40,0,yy+10);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(200,245,255,.55)');
  x.fillStyle=gr;x.fillRect(872+(i%3)*24,yy-40,10,50);}
 x.restore();
 x.save();x.globalCompositeOperation='lighter';
 x.strokeStyle='rgba(60,200,255,'+(.18+.14*Math.sin(t*2.2))+')';x.lineWidth=10;x.beginPath();x.ellipse(840,690+by,640,110,0,Math.PI*.55,Math.PI*1.25);x.stroke();
 x.strokeStyle='rgba(255,50,60,'+(.18+.14*Math.sin(t*2.2+3))+')';x.beginPath();x.ellipse(840,690+by,690,100,0,-Math.PI*.1,Math.PI*.45);x.stroke();
 const bl=Math.max(0,Math.sin(t*3));
 let r=x.createRadialGradient(1045,289+by,0,1045,289+by,36);r.addColorStop(0,'rgba(255,60,60,'+.8*bl+')');r.addColorStop(1,'rgba(255,60,60,0)');
 x.fillStyle=r;x.fillRect(1000,240+by,90,90);
 const eye=.25+.2*Math.sin(t*1.6);
 [[803,466],[858,461]].forEach(e=>{let q=x.createRadialGradient(e[0],e[1]+by,0,e[0],e[1]+by,34);q.addColorStop(0,'rgba(80,220,255,'+eye+')');q.addColorStop(1,'rgba(80,220,255,0)');x.fillStyle=q;x.fillRect(e[0]-40,e[1]-40+by,80,80)});
 stars.forEach(s=>{const a=.2+.8*Math.max(0,Math.sin(t*1.8+s.p));
  x.strokeStyle='rgba(255,255,255,'+a+')';x.lineWidth=2;const r=s.r*(.6+a*.6);
  x.beginPath();x.moveTo(s.x-r,s.y);x.lineTo(s.x+r,s.y);x.moveTo(s.x,s.y-r);x.lineTo(s.x,s.y+r);x.stroke();
  let q=x.createRadialGradient(s.x,s.y,0,s.x,s.y,r*1.6);q.addColorStop(0,'rgba(255,255,255,'+a*.5+')');q.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=q;x.fillRect(s.x-r*2,s.y-r*2,r*4,r*4)});
 dust.forEach(d=>{const px=(d.x+t*d.s*14)%IW,py=(d.y-t*d.s*5+IH)%IH;
  x.fillStyle='rgba(190,210,255,'+(.25+.25*Math.sin(t+d.p))+')';x.beginPath();x.arc(px,py,d.r,0,7);x.fill()});
 x.restore();
 if(!T.done){const k=T.getContext('2d');k.drawImage(img,0,0);k.globalCompositeOperation='destination-in';
  let h=k.createLinearGradient(370,0,1300,0);h.addColorStop(0,'rgba(0,0,0,0)');h.addColorStop(.05,'#000');h.addColorStop(.95,'#000');h.addColorStop(1,'rgba(0,0,0,0)');k.fillStyle=h;k.fillRect(0,0,IW,IH);
  let v=k.createLinearGradient(0,45,0,250);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(.12,'#000');v.addColorStop(.88,'#000');v.addColorStop(1,'rgba(0,0,0,0)');k.fillRect(0,0,IW,IH);k.fillStyle=v;k.globalCompositeOperation='destination-in';k.fillRect(0,0,IW,IH);T.done=1;}
 x.drawImage(T,0,0);
 requestAnimationFrame(draw);
}
